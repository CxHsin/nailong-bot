name: Checks

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - name: Install file tool dependencies (Windows)
        run: |
          choco install fd ripgrep --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          fd --version
          rg --version
      - run: npm run typecheck
      # Recovery tests persist real SQLite state; avoid contention between test files.
      - run: node --import tsx --test --test-concurrency=1 test/*.test.ts
      - run: npm run build
