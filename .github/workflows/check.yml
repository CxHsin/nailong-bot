name: Checks

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install file tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fd-find ripgrep
          fdfind --version
          rg --version
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
